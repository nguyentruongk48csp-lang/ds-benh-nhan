<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DS bệnh nhân">
<meta name="theme-color" content="#0f6e74">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Danh sách bệnh nhân</title>
<style>
  :root{ --bg:#eef2f3; --muted:#5b6a72 }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0d1417; --muted:#98a8b0 } }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font:15px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--muted);pointer-events:none}
  /* Chế độ in (bản 13): trang ngoài cùng hiện bảng A4 và tự in */
  #pr{display:none;background:#fff;color:#111;min-height:100%}
  #pr .pbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0f6e74;color:#fff;
    font:15px -apple-system,"Segoe UI",Arial,sans-serif;z-index:2}
  #pr .pbar b{flex:1}
  #pr .pbar button{font:inherit;font-size:16px;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:#0f6e74;font-weight:600}
  #pr .phint{font:13px -apple-system,"Segoe UI",Arial,sans-serif;color:#555;padding:0 12px 16px}
  body.printing{overflow:auto;height:auto;background:#fff}
  html.printing{overflow:auto;height:auto}
  body.printing #app, body.printing .msg{display:none}
  body.printing #pr{display:block}
  @media print{ #pr .pbar, #pr .phint{display:none} body{padding:0} }
</style>
</head>
<body>
<!-- Giao diện bản 13: nhúng trang Google Apps Script (dữ liệu từ Google Sheet "DS bệnh nhân 5C").
     Khi nhúng, Google không hiện dòng "This application was created by a Google Apps Script user".
     Xuất PDF: trang Google gửi bảng A4 sang đây, trang này in (iPhone chỉ cho in ở trang ngoài cùng). -->
<div class="msg" id="msg">Đang tải…</div>
<iframe id="app" title="Danh sách bệnh nhân" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbxLSriEPR4JFwqsL_wCEFbqMAQBVsvF0xBWsTkW86jQsnAG4f89KKyCviuzvKvWeSQs/exec?host=gh"></iframe>
<div id="pr">
  <div class="pbar"><button type="button" id="prBack">‹ Quay lại</button><b>PDF A4</b><button type="button" id="prGo">In / Lưu PDF</button></div>
  <style id="prCss"></style>
  <div id="prBody"></div>
  <p class="phint">Trên iPhone: bấm "In / Lưu PDF" → trong màn hình in bấm nút Chia sẻ → Lưu vào Tệp. Trên máy tính: chọn máy in "Lưu thành PDF".</p>
</div>
<script>
  var app = document.getElementById("app"), oldTitle = document.title;
  app.addEventListener("load", function(){ document.getElementById("msg").style.display = "none"; });
  function okOrigin(o){ return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/.test(o); }
  window.addEventListener("message", function(ev){
    var d = ev.data;
    if (!d || d.type !== "dsbn-print" || !okOrigin(ev.origin)) return;
    // chỉ giữ phần CSS cho bảng, bỏ quy tắc body/.bar của trang in cũ
    document.getElementById("prCss").textContent =
      "#prBody{padding:14px 12px;font:12px/1.35 Arial,Helvetica,sans-serif}" +
      "#prBody h3{text-align:center;margin:0 0 2px;font-size:17px}#prBody .sub{text-align:center;margin:0 0 10px;font-style:italic}" +
      "#prBody table{width:100%;border-collapse:collapse}#prBody th,#prBody td{border:1px solid #333;padding:3px 4px;vertical-align:top;text-align:left}" +
      "#prBody th{background:#e8eef2;text-align:center}#prBody td.c{text-align:center}#prBody tr.room-row td{background:#f2f5f6;font-weight:700}" +
      "#prBody tr{page-break-inside:avoid}@media print{#prBody{padding:0;font-size:10.5px}@page{size:A4;margin:9mm}}";
    var tpl = document.createElement("template");
    tpl.innerHTML = String(d.body || "");
    tpl.content.querySelectorAll("script,iframe,object,embed").forEach(function(n){ n.remove(); });
    tpl.content.querySelectorAll("*").forEach(function(n){
      [].slice.call(n.attributes).forEach(function(a){ if (/^on/i.test(a.name)) n.removeAttribute(a.name); });
    });
    var box = document.getElementById("prBody"); box.innerHTML = ""; box.appendChild(tpl.content);
    if (d.title) document.title = d.title;
    document.documentElement.classList.add("printing"); document.body.classList.add("printing");
    window.scrollTo(0, 0);
    try { ev.source.postMessage({ type: "dsbn-print-ok" }, "*"); } catch(e){}
  });
  document.getElementById("prGo").addEventListener("click", function(){ window.print(); });
  document.getElementById("prBack").addEventListener("click", function(){
    document.documentElement.classList.remove("printing"); document.body.classList.remove("printing");
    document.title = oldTitle;
  });
</script>
</body>
</html>
