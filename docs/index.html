<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DS bệnh nhân">
<meta name="theme-color" content="#0f6e74">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Danh sách bệnh nhân</title>
<style>
  :root{ --bg:#eef2f3; --muted:#5b6a72 }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0d1417; --muted:#98a8b0 } }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font:15px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--muted);pointer-events:none}
</style>
</head>
<body>
<!-- Giao diện bản 11: nhúng trang Google Apps Script (dữ liệu từ Google Sheet "DS bệnh nhân 5C").
     Khi nhúng, Google không hiện dòng "This application was created by a Google Apps Script user". -->
<div class="msg" id="msg">Đang tải…</div>
<iframe id="app" title="Danh sách bệnh nhân" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbxLSriEPR4JFwqsL_wCEFbqMAQBVsvF0xBWsTkW86jQsnAG4f89KKyCviuzvKvWeSQs/exec"></iframe>
<script>
  document.getElementById("app").addEventListener("load", function(){ document.getElementById("msg").style.display = "none"; });
</script>
</body>
</html>
