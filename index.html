<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DS bệnh nhân">
<meta name="theme-color" content="#0f6e74">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Danh sách bệnh nhân</title>
<style>
:root{
  --bg:#f3f6f8; --card:#ffffff; --ink:#14212b; --muted:#5d6b77; --line:#dde4ea;
  --brand:#0f6e74; --brand-ink:#ffffff; --badge:#e3f1f1; --badge-ink:#0b5257;
  --cang:#fdecd8; --cang-ink:#8a4b08; --err:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1418; --card:#172127; --ink:#e8eef2; --muted:#9aa9b4; --line:#26343d;
    --brand:#3fb6ad; --brand-ink:#04211f; --badge:#183a3b; --badge-ink:#9fe3dc;
    --cang:#3d2a14; --cang-ink:#f6c58b; --err:#ff8a80;
  }
}
*{box-sizing:border-box}
html,body{margin:0;touch-action:pan-y;-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 32px}
header{
  padding:14px 0 10px;border-bottom:1px solid var(--line);
}
.row{display:flex;align-items:center;gap:8px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
button{
  font:inherit;font-size:15px;min-height:44px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
input[type=password],input[type=search],input[type=text]{
  font:inherit;font-size:16px;width:100%;min-height:46px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
}
input:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
/* khoá */
.lock{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:22px 18px}
.lock h2{margin:0 0 4px;font-size:19px}
.lock p{margin:0 0 14px;color:var(--muted);font-size:14px}
.lock label.chk{display:flex;align-items:center;gap:8px;margin:12px 0 14px;font-size:15px;min-height:44px}
.lock label.chk input{width:20px;height:20px}
.lock form button{margin-top:12px}
.lock .err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
.lock button{width:100%}
/* danh sách */
.list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bed{flex:0 0 64px;align-self:flex-start;text-align:center;background:var(--badge);color:var(--badge-ink);
  border-radius:10px;padding:6px 4px;line-height:1.15}
.bed.cang{background:var(--cang);color:var(--cang-ink)}
.bed small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.bed b{display:block;font-size:20px}
.bed .no{display:block;font-size:11.5px;margin-top:3px;padding-top:3px;border-top:1px solid currentColor;opacity:.75}
.offline{color:var(--cang-ink)}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:16.5px}
.age{color:var(--muted);font-weight:400;font-size:15px;white-space:nowrap}
.dx{margin-top:3px;font-size:15px;overflow-wrap:anywhere}
.item{flex-wrap:wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.note{flex-basis:100%;margin-top:2px}
.note-view{background:var(--cang);color:var(--cang-ink);border-radius:8px;padding:8px 10px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.note textarea{font:inherit;font-size:16px;width:100%;min-height:84px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--brand);background:var(--card);color:var(--ink);resize:vertical;-webkit-user-select:text;user-select:text}
.note .tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
.note .tools button{min-height:40px}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
.hidden{display:none!important}
.spin{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">

  <section id="lockView" class="lock hidden" aria-labelledby="lockTitle">
    <h2 id="lockTitle">Danh sách bệnh nhân</h2>
    <p>Danh sách đã được mã hoá. Nhập mật khẩu một lần, máy này sẽ nhớ để lần sau mở là xem được ngay.</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" aria-label="Mật khẩu">
      <button class="primary" type="submit">Mở danh sách</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </section>

  <section id="listView" class="hidden">
    <header>
      <div class="row">
        <h1>Danh sách bệnh nhân</h1>
        <button id="reload" type="button" aria-label="Tải lại">↻ Tải lại</button>
      </div>
      <div class="meta" id="meta"></div>
      <div class="hint">Chạm 2 lần vào một bệnh nhân để viết ghi chú.</div>
    </header>
    <ul class="list" id="list"></ul>
    <footer>Dữ liệu được mã hoá, chỉ người có mật khẩu mới đọc được.</footer>
  </section>

  <div id="loading" class="spin">Đang tải…</div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "dsbn_pw", CACHE = "dsbn_data", NOTES = "dsbn_notes";
  var $ = function(id){ return document.getElementById(id); };
  var enc = null, rows = [], payload = null;

  function store(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function show(id){ ["lockView","listView","loading"].forEach(function(x){ $(x).classList.toggle("hidden", x!==id); }); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var offline = false;
  async function fetchData(){
    var r;
    try { r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"}); }
    catch(e){ r = null; }
    if (r && r.status === 404) throw new Error("NODATA");
    if (r && r.ok){
      var j = await r.json();
      store(CACHE, JSON.stringify(j));      // lưu bản đã mã hoá để xem khi mất mạng
      offline = false;
      return j;
    }
    var c = load(CACHE);                     // mất mạng: dùng bản gần nhất (vẫn mã hoá)
    if (c){ offline = true; return JSON.parse(c); }
    throw new Error("NET");
  }

  async function decrypt(blob, pw){
    var te = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", te.encode(pw.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function bedBadge(g, stt){
    var s = String(g).trim(), m = s.match(/\d+/), isCang = /^c[aá]ng/i.test(s);
    var label = isCang ? "Cáng" : (/^gi/i.test(s) ? "Giường" : "");
    var num = isCang ? s.replace(/^c[aá]ng\s*/i,"") : (m ? m[0] : s);
    if (!label) { label = ""; num = s; }
    return '<div class="bed'+(isCang?' cang':'')+'"><small>'+esc(label)+'</small><b>'+esc(num)+'</b><span class="no">STT '+esc(stt)+'</span></div>';
  }

  function render(){
    var html = rows.map(function(r){
      var k = noteKey(r), n = notes[k] || "";
      var noteHtml = editing === k
        ? '<div class="note"><textarea data-k="'+esc(k)+'" placeholder="Ghi chú cho bệnh nhân này…">'+esc(n)+'</textarea>'+
          '<div class="tools"><span>Tự lưu trên máy này</span><button type="button" class="done">Xong</button></div></div>'
        : (n ? '<div class="note"><div class="note-view">'+esc(n)+'</div></div>' : '');
      return '<li class="item" data-k="'+esc(k)+'">'+bedBadge(r[1], r[0])+'<div class="info">'+
        '<div><span class="name">'+esc(r[2])+'</span> <span class="age">· '+esc(r[3])+' tuổi</span></div>'+
        '<div class="dx">'+esc(r[4])+'</div></div>'+noteHtml+'</li>';
    }).join("");
    $("list").innerHTML = html || '<li class="empty">Danh sách trống.</li>';
    var ta = $("list").querySelector("textarea");
    if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }

  /* ---- ghi chú: lưu trên máy, gắn theo họ tên + tuổi ---- */
  var notes = {}, editing = null, lastTap = {k:null, t:0};
  try { notes = JSON.parse(load(NOTES) || "{}") || {}; } catch(e){ notes = {}; }
  function noteKey(r){ return String(r[2]).trim().toUpperCase() + "|" + String(r[3]).trim(); }
  function saveNotes(){ store(NOTES, JSON.stringify(notes)); }
  function toggleNote(k){ editing = (editing === k) ? null : k; render(); }
  $("list").addEventListener("click", function(ev){
    if (ev.target.closest("textarea")) return;
    if (ev.target.closest(".done")){ editing = null; render(); return; }
    var li = ev.target.closest(".item"); if (!li) return;
    var k = li.getAttribute("data-k"), now = Date.now();
    if (lastTap.k === k && now - lastTap.t < 400){ lastTap = {k:null, t:0}; toggleNote(k); }
    else lastTap = {k:k, t:now};
  });
  $("list").addEventListener("input", function(ev){
    var ta = ev.target.closest("textarea"); if (!ta) return;
    var k = ta.getAttribute("data-k"), v = ta.value;
    if (v.trim()) notes[k] = v; else delete notes[k];
    saveNotes();
  });

  function showList(p){
    payload = p; rows = p.rows || [];
    $("meta").innerHTML = "Cập nhật " + esc(p.updated || "?") + " · " + rows.length + " bệnh nhân" +
      (offline ? ' <span class="offline">· đang xem bản lưu (mất mạng)</span>' : "");
    render(); show("listView");
  }

  async function open(pw, silent){
    try{
      if (!enc) enc = await fetchData();
    }catch(e){
      show("lockView");
      $("err").textContent = e.message === "NODATA" ? "Chưa có danh sách nào được đăng lên."
        : "Không tải được dữ liệu, kiểm tra kết nối mạng rồi bấm Mở lại.";
      if (silent && load(KEY)) $("pw").value = "";
      return false;
    }
    try{
      var p = await decrypt(enc, pw);
      store(KEY, pw);
      $("err").textContent = "";
      showList(p);
      return true;
    }catch(e){
      // sai mật khẩu (hoặc bạn đã đổi mật khẩu trong phần mềm) -> hỏi lại
      store(KEY, null);
      show("lockView");
      $("err").textContent = silent ? "Mật khẩu đã thay đổi, hãy nhập mật khẩu mới." : "Sai mật khẩu.";
      return false;
    }
  }

  async function refresh(){
    var pw = load(KEY);
    enc = null;
    if (!pw){ show("lockView"); return; }
    if (payload) $("meta").textContent = "Đang tải lại…";
    await open(pw, true);
  }

  $("lockForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = $("pw").value || load(KEY);
    if (!pw) return;
    $("err").textContent = "Đang mở…";
    open(pw, false).then(function(ok){ if(ok) $("pw").value=""; });
  });
  $("reload").addEventListener("click", refresh);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && payload && !editing) refresh();
  });

  document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("touchmove", function(e){ if (e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (!window.crypto || !crypto.subtle){
    show("lockView"); $("err").textContent = "Trình duyệt không hỗ trợ giải mã. Hãy mở bằng Safari/Chrome bản mới.";
  } else {
    refresh();
  }
})();
</script>
</body>
</html>
